name: Update Bandcamp RSS feeds

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов. Поменять можно позже (см. шаг 7)
  workflow_dispatch:         # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write            # обязательно: workflow должен пушить XML обратно в репозиторий

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Generate feeds
        run: python fix.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss_feeds/
          git diff --staged --quiet || git commit -m "Update feeds: $(date -u +'%Y-%m-%d %H:%M')"
          git push
